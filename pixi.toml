[workspace]
name = "inequality-reanalysis"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.12.*"
pandas = ">=2.2,<3"
pyarrow = ">=18,<24"
numpy = ">=2,<3"
scipy = ">=1.14,<2"
matplotlib = ">=3.9,<4"
requests = ">=2.32,<3"
tenacity = ">=9,<10"
openpyxl = ">=3.1,<4"
xlrd = ">=2,<3"
pyyaml = ">=6,<7"
pandera = ">=0.24,<1"
pytest = ">=8,<10"
ruff = ">=0.12,<1"
pre-commit = ">=4,<5"
beautifulsoup4 = ">=4.12,<5"
pycountry = ">=24,<27"

[tasks]
test = "python -m pytest"
lint = "ruff check code tests"

[tool]
