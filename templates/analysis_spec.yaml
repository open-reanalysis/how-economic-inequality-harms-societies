# Template for config/specs/<spec_id>.yaml. Validated by code/lib/spec.py.
# Placeholders in angle brackets. Every choice the original material leaves
# open names its section of docs/method_rationale.md in `rationale`.
spec_id: <historical_international | historical_us_states | updated_international | updated_us_states>
version: 1
dataset: <international | us_states>
unit_type: <country | us_state>
sample:
  kind: <fixed | eligibility_table>
  units: [<unit_id>, ...]            # for kind fixed
  table: <outputs/tables/...csv>     # for kind eligibility_table
  rationale: <section>
variables:
  - variable_id: <lineage variable_id>
    role: <inequality | index_component | extra_measure>
    sources: [<primary source_id>, <secondary source_id>]   # priority order for parallel data
    period: <year or range>
    unit: <unit after conversion>
    conversion: <none | expression>
    transformation: <none | log | ...>
    direction: <as_is | reverse_coded>
    series_classes: [<EXACT_SUCCESSOR>, <CONCEPTUAL_SUCCESSOR>]   # updated specs only
    rationale: <section>
missing_values:
  rule: <rule name>
  rationale: <section>
standardisation:
  method: z_score
  reference: <sample units>
  rationale: <section>
index:
  components: [<variable_id>, ...]
  weights: <equal | mapping>
  minimum_components: <integer>
  rationale: <section>
statistics: [pearson_r, p_value, n]
results:
  - result_type: <historical_reproduction | current_fixed_sample | current_fixed_sample_with_substitutes | current_eligibility_refreshed>
    sample: <fixed | eligibility_table>
    series_classes: [<class>, ...]
